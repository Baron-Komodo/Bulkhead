<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual</title>
</head>
<style>
  :root{
    --white: #ededed;
  }
  *{
    padding: 0;
    margin: 0;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  body{
    background-color: grey;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main{
    border: 3px rgb(19, 19, 79) solid;
    background-color: var(--white);
    width: 50rem;
    min-height: 100rem;
    margin: 2rem 0 2rem 0;
  }
  h1{
    background-color: rgb(19, 19, 79);
    color: var(--white);
    padding: 0.5rem;
  }

  .dividor{
    width: 80%;
    margin: 1rem 1rem 0.6rem 1rem;
    background-color: rgb(19, 19, 79);
    height: 1.5px;
  }

  h4{
    margin: 1rem;
  }

  p{
    margin-left: 1rem;
    margin-right: 1rem;
  }

</style>
<body>
  <main>
    <h1>Coast of Honor</h1>

    <h4>1. Overview</h4>
    <div class="dividor"></div>
    <p id="paragraph">
      Coast of Honor is a game in which you take on the role of an admiral. Players operate on a world map, aiming to conduct trade to maximize the number of ports they control and to expand their armies in order to wage war.
     </p>

    <h4>X. Devlog</h4>
    <div class="dividor"></div>
    <p id="paragraph">
      BETA 1.0 <br>
      ------------ <br>
      [.26]
     </p>


  </main>
</body>
</html>
